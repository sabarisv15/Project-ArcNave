function tagFor(text){
  var t=(text||"").toLowerCase();
  if(t.indexOf("avoid")>=0||t.indexOf("reject")>=0)return ["tag-avoid","Avoid"];
  if(t.indexOf("build")>=0)return ["tag-build","Build"];
  if(t.indexOf("defer")>=0)return ["tag-defer","Defer"];
  if(t.indexOf("conditional")>=0)return ["tag-cond","Conditional"];
  return ["tag-keep","Keep / use"];
}
var listEl=document.getElementById("list");
var total=0;
var STATE_KEY="arcnave_vertex_audit_standalone_v1";
function loadState(){try{return JSON.parse(localStorage.getItem(STATE_KEY)||"{}");}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(STATE_KEY,JSON.stringify(s));}catch(e){}}
var state=loadState();
DATA.forEach(function(sec){
  var h=document.createElement("div");
  h.className="sec";
  h.textContent=sec[0];
  listEl.appendChild(h);
  var cols=sec[2];
  sec[3].forEach(function(row){
    total++;
    var id=sec[1]+"-"+row[0];
    var name=row[1];
    var fields=row.slice(2);
    var tagSource=(sec[1]==="cap")?fields[4]:fields[fields.length-1];
    var t=tagFor(tagSource);
    var card=document.createElement("div");
    card.className="card collapsed";
    card.setAttribute("data-id",id);
    var body="";
    for(var i=0;i<cols.length;i++){
      body+='<div class="field"><span class="flabel">'+cols[i]+'</span><span class="fval">'+(fields[i]||"—")+'</span></div>';
    }
    card.innerHTML =
      '<div class="chead"><span class="cid">'+row[0]+'</span><span class="cname">'+name+'</span><span class="tag '+t[0]+'">'+t[1]+'</span><span class="chev">&#9660;</span></div>'+
      '<div class="cbody">'+body+
      '<div class="actions"><button class="abtn accept" data-act="accept">&#10003; Accept</button><button class="abtn reject" data-act="reject">&#10005; Reject</button></div>'+
      '<textarea class="note" placeholder="Your note for this item"></textarea>'+
      '</div>';
    listEl.appendChild(card);
    var chead=card.querySelector(".chead");
    chead.addEventListener("click",function(){card.classList.toggle("collapsed");});
    var acceptBtn=card.querySelector(".abtn.accept");
    var rejectBtn=card.querySelector(".abtn.reject");
    var noteEl=card.querySelector(".note");
    function applyDecision(dec){
      acceptBtn.classList.toggle("on",dec==="accept");
      rejectBtn.classList.toggle("on",dec==="reject");
      card.classList.toggle("dec-accept",dec==="accept");
      card.classList.toggle("dec-reject",dec==="reject");
    }
    function setDecision(dec){
      var s=loadState();
      if(!s[id])s[id]={};
      s[id].dec=(s[id].dec===dec)?null:dec;
      saveState(s);
      applyDecision(s[id].dec);
      updateStats();
    }
    acceptBtn.addEventListener("click",function(e){e.stopPropagation();setDecision("accept");});
    rejectBtn.addEventListener("click",function(e){e.stopPropagation();setDecision("reject");});
    noteEl.addEventListener("click",function(e){e.stopPropagation();});
    noteEl.addEventListener("input",function(){
      var s=loadState();
      if(!s[id])s[id]={};
      s[id].note=noteEl.value;
      saveState(s);
    });
    if(state[id]){
      card.classList.remove("collapsed");
      applyDecision(state[id].dec||null);
      noteEl.value=state[id].note||"";
    }
  });
});
function updateStats(){
  var s=loadState();
  var acc=0,rej=0;
  Object.keys(s).forEach(function(k){if(s[k].dec==="accept")acc++;else if(s[k].dec==="reject")rej++;});
  document.getElementById("cAcc").textContent=acc;
  document.getElementById("cRej").textContent=rej;
  document.getElementById("cPen").textContent=total-acc-rej;
}
updateStats();
document.getElementById("collapseAll").addEventListener("click",function(){
  listEl.querySelectorAll(".card").forEach(function(c){c.classList.add("collapsed");});
});
document.getElementById("expandAll").addEventListener("click",function(){
  listEl.querySelectorAll(".card").forEach(function(c){c.classList.remove("collapsed");});
});
document.getElementById("resetBtn").addEventListener("click",function(){
  if(!confirm("Reset every accept/reject decision and note?"))return;
  saveState({});
  listEl.querySelectorAll(".card").forEach(function(card){
    card.classList.remove("dec-accept","dec-reject");
    card.querySelector(".abtn.accept").classList.remove("on");
    card.querySelector(".abtn.reject").classList.remove("on");
    card.querySelector(".note").value="";
  });
  updateStats();
});
function buildSummary(){
  var s=loadState();
  var names={};
  DATA.forEach(function(sec){sec[3].forEach(function(row){names[sec[1]+"-"+row[0]]=row[0]+" "+row[1];});});
  var acc=[],rej=[],noted=[];
  Object.keys(s).forEach(function(k){
    if(s[k].dec==="accept")acc.push(names[k]+(s[k].note?" (note: "+s[k].note+")":""));
    else if(s[k].dec==="reject")rej.push(names[k]+(s[k].note?" (note: "+s[k].note+")":""));
    else if(s[k].note)noted.push(names[k]+" (note: "+s[k].note+")");
  });
  var msg="My finalized decisions on the ArcNave Vertex/Gemini capability audit:\n\n";
  msg+="ACCEPTED ("+acc.length+"):\n"+(acc.length?acc.map(function(x){return "- "+x;}).join("\n"):"(none)")+"\n\n";
  msg+="REJECTED ("+rej.length+"):\n"+(rej.length?rej.map(function(x){return "- "+x;}).join("\n"):"(none)")+"\n\n";
  if(noted.length){msg+="NOTES WITHOUT A DECISION:\n"+noted.map(function(x){return "- "+x;}).join("\n")+"\n\n";}
  msg+="Please proceed only with the accepted items.";
  return msg;
}
document.getElementById("exportBtn").addEventListener("click",function(){
  var box=document.getElementById("exportBox");
  var ta=document.getElementById("exportText");
  ta.value=buildSummary();
  box.style.display="block";
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
});
document.getElementById("copyBtn").addEventListener("click",function(){
  var ta=document.getElementById("exportText");
  ta.select();
  document.execCommand("copy");
  this.textContent="Copied!";
  var self=this;
  setTimeout(function(){self.textContent="Copy to clipboard";},1500);
});
document.getElementById("downloadTxtBtn").addEventListener("click",function(){
  var text=document.getElementById("exportText").value;
  var blob=new Blob([text],{type:"text/plain"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="arcnave-vertex-audit-decisions.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
