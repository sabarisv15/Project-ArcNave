<svg width="900" height="800" viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ARCNAVE system architecture</title>
<desc>Layered architecture from the React frontend down through tenant middleware, routes, business services, the WorkflowService approval gate and DocumentService storage owner, repositories, and PostgreSQL, with the AI subsystem (tool registry, tool retrieval, provider adapters, external LLMs) branching off the AI route and reaching into WorkflowService for any Level 3 action.</desc>
<rect width="900" height="800" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- connectors -->
<g stroke="#888780" stroke-width="1" fill="none">
<line x1="440" y1="90" x2="440" y2="118" marker-end="url(#arrow)"/>
<line x1="440" y1="170" x2="262" y2="205" marker-end="url(#arrow)"/>
<line x1="440" y1="170" x2="650" y2="205" marker-end="url(#arrow)"/>
<line x1="262" y1="255" x2="262" y2="298" marker-end="url(#arrow)"/>
<line x1="650" y1="255" x2="650" y2="298" marker-end="url(#arrow)"/>
<line x1="262" y1="350" x2="165" y2="393" marker-end="url(#arrow)"/>
<line x1="262" y1="350" x2="360" y2="393" marker-end="url(#arrow)"/>
<line x1="650" y1="350" x2="650" y2="393" marker-end="url(#arrow)"/>
<line x1="165" y1="443" x2="262" y2="488" marker-end="url(#arrow)"/>
<line x1="360" y1="443" x2="262" y2="488" marker-end="url(#arrow)"/>
<line x1="650" y1="443" x2="650" y2="488" marker-end="url(#arrow)"/>
<line x1="650" y1="538" x2="650" y2="583" marker-end="url(#arrow)"/>
<line x1="262" y1="538" x2="330" y2="678" marker-end="url(#arrow)"/>
</g>
<line x1="590" y1="350" x2="240" y2="393" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowDash)"/>

<!-- Client -->
<g>
<rect x="340" y="30" width="200" height="60" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="440" y="55" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">React frontend</text>
<text x="440" y="73" text-anchor="middle" font-size="12" fill="#444441" font-family="sans-serif">calls /api/v1 + AI composer</text>
</g>

<!-- Tenant middleware -->
<g>
<rect x="290" y="110" width="300" height="60" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="440" y="135" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">Multi-tenant middleware</text>
<text x="440" y="153" text-anchor="middle" font-size="12" fill="#444441" font-family="sans-serif">resolves college, opens RLS tx</text>
</g>

<!-- Domain routes -->
<g>
<rect x="132" y="205" width="260" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="262" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">Domain routes</text>
<text x="262" y="244" text-anchor="middle" font-size="12" fill="#185FA5" font-family="sans-serif">students, staff, attendance...</text>
</g>

<!-- AI route -->
<g>
<rect x="550" y="205" width="200" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="650" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">AI route</text>
<text x="650" y="244" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">/ai/ask, /ai/ask/stream</text>
</g>

<!-- Business services -->
<g>
<rect x="102" y="298" width="320" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="262" y="320" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">Business services layer</text>
<text x="262" y="338" text-anchor="middle" font-size="12" fill="#185FA5" font-family="sans-serif">only layer allowed to touch data</text>
</g>

<!-- aiToolRegistry -->
<g>
<rect x="530" y="298" width="240" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="650" y="320" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">aiToolRegistry</text>
<text x="650" y="338" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">75 tools, L1/L2/L3 policy gate</text>
</g>

<!-- WorkflowService -->
<g>
<rect x="65" y="393" width="200" height="50" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="165" y="414" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13" font-family="sans-serif">WorkflowService</text>
<text x="165" y="432" text-anchor="middle" font-size="12" fill="#993C1D" font-family="sans-serif">sole approval gate</text>
</g>

<!-- DocumentService -->
<g>
<rect x="285" y="393" width="150" height="50" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="360" y="414" text-anchor="middle" font-size="14" font-weight="500" fill="#633806" font-family="sans-serif">DocumentService</text>
<text x="360" y="432" text-anchor="middle" font-size="12" fill="#854F0B" font-family="sans-serif">sole file-storage owner</text>
</g>

<!-- Tool retrieval -->
<g>
<rect x="530" y="393" width="240" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="650" y="414" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">Tool retrieval</text>
<text x="650" y="432" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">semantic + lexical filter</text>
</g>

<!-- Repositories -->
<g>
<rect x="132" y="488" width="260" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="262" y="509" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C" font-family="sans-serif">Repositories layer</text>
<text x="262" y="527" text-anchor="middle" font-size="12" fill="#185FA5" font-family="sans-serif">no repo calls another repo</text>
</g>

<!-- Provider adapters -->
<g>
<rect x="530" y="488" width="240" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="650" y="509" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">Provider adapters</text>
<text x="650" y="527" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">gemini, claude, openai, self-hosted</text>
</g>

<!-- External LLM APIs -->
<g>
<rect x="520" y="583" width="260" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="650" y="604" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">External LLM APIs</text>
<text x="650" y="622" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">Vertex, Anthropic, OpenAI</text>
</g>

<!-- PostgreSQL -->
<g>
<rect x="200" y="678" width="280" height="60" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="340" y="703" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">PostgreSQL + pgvector</text>
<text x="340" y="721" text-anchor="middle" font-size="12" fill="#444441" font-family="sans-serif">RLS isolation + audit_log</text>
</g>

<!-- legend -->
<text x="450" y="775" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="sans-serif">blue = app data path · teal = AI subsystem · coral = approval gate · amber = file-storage owner · dashed = AI L3 action</text>
</svg>
