<svg width="680" height="800" viewBox="0 0 680 800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ARCNAVE Curriculum mode vs General mode</title>
<desc>A new message starts in Composer mode, defaulting to General. General mode calls askGeneralChat with zero tools and a minimal CORE policy, making one LLM call. Curriculum mode calls askAgent's tool-use loop, running tool retrieval and a larger policy, making one to six LLM calls, and any Level 3 action must pass a Policy Gate that always pauses for human approval. Both paths converge on an answer returned to the user.</desc>
<rect width="680" height="800" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g stroke="#888780" stroke-width="1" fill="none">
<line x1="340" y1="90" x2="340" y2="118" marker-end="url(#arrow)"/>
<line x1="340" y1="170" x2="167" y2="208" marker-end="url(#arrow)"/>
<line x1="340" y1="170" x2="513" y2="208" marker-end="url(#arrow)"/>
<line x1="165" y1="260" x2="165" y2="298" marker-end="url(#arrow)"/>
<line x1="515" y1="260" x2="515" y2="298" marker-end="url(#arrow)"/>
<line x1="165" y1="350" x2="165" y2="388" marker-end="url(#arrow)"/>
<line x1="515" y1="350" x2="515" y2="388" marker-end="url(#arrow)"/>
<line x1="165" y1="440" x2="165" y2="478" marker-end="url(#arrow)"/>
<line x1="515" y1="440" x2="515" y2="478" marker-end="url(#arrow)"/>
<line x1="515" y1="530" x2="515" y2="568" marker-end="url(#arrow)"/>
<line x1="165" y1="530" x2="298" y2="658" marker-end="url(#arrow)"/>
<line x1="515" y1="620" x2="382" y2="658" marker-end="url(#arrow)"/>
</g>

<g>
<rect x="240" y="40" width="200" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="61" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">New message</text>
<text x="340" y="78" text-anchor="middle" font-size="12" fill="#444441" font-family="sans-serif">any question, e.g. hi</text>
</g>

<g>
<rect x="250" y="120" width="180" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="141" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">Composer mode</text>
<text x="340" y="158" text-anchor="middle" font-size="12" fill="#444441" font-family="sans-serif">default: general</text>
</g>

<g>
<rect x="85" y="210" width="160" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="165" y="231" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489" font-family="sans-serif">askGeneralChat</text>
<text x="165" y="248" text-anchor="middle" font-size="12" fill="#534AB7" font-family="sans-serif">no tool ever built</text>
</g>
<g>
<rect x="425" y="210" width="180" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="515" y="231" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">askAgent tool loop</text>
<text x="515" y="248" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">adaptive, multi-step</text>
</g>

<g>
<rect x="75" y="300" width="180" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="165" y="321" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489" font-family="sans-serif">Policy: CORE only</text>
<text x="165" y="338" text-anchor="middle" font-size="12" fill="#534AB7" font-family="sans-serif">+CONTINUITY if history</text>
</g>
<g>
<rect x="425" y="300" width="180" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="515" y="321" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">Tool retrieval</text>
<text x="515" y="338" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">role + semantic filter</text>
</g>

<g>
<rect x="65" y="390" width="200" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="165" y="411" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489" font-family="sans-serif">0 tools sent</text>
<text x="165" y="428" text-anchor="middle" font-size="12" fill="#534AB7" font-family="sans-serif">structural, not a prompt</text>
</g>
<g>
<rect x="425" y="390" width="180" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="515" y="411" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">Adds TOOL_SELECTION</text>
<text x="515" y="428" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">+PLAN if 2+ tools</text>
</g>

<g>
<rect x="75" y="480" width="180" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="165" y="501" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489" font-family="sans-serif">1 LLM call</text>
<text x="165" y="518" text-anchor="middle" font-size="12" fill="#534AB7" font-family="sans-serif">completeMaybeStreaming</text>
</g>
<g>
<rect x="415" y="480" width="200" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="515" y="501" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" font-family="sans-serif">completeWithTools loop</text>
<text x="515" y="518" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">1 to 6 calls, capped</text>
</g>

<g>
<rect x="415" y="570" width="200" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="515" y="591" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13" font-family="sans-serif">Policy gate</text>
<text x="515" y="608" text-anchor="middle" font-size="12" fill="#993C1D" font-family="sans-serif">L3 action always pauses</text>
</g>

<g>
<rect x="245" y="660" width="190" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="681" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">Answer returned</text>
<text x="340" y="698" text-anchor="middle" font-size="12" fill="#444441" font-family="sans-serif">streamed to the user</text>
</g>

<text x="340" y="745" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="sans-serif">purple = general/research path · teal = curriculum path · coral = safety gate</text>
</svg>
